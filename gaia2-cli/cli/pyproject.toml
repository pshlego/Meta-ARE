[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia2-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["click>=8.0", "gaia2-core"]

[project.scripts]
# App CLIs go through env_rules.run_app (a passthrough unless env rules are installed).
calendar = "gaia2_cli.env_rules:calendar_main"
contacts = "gaia2_cli.env_rules:contacts_main"
emails = "gaia2_cli.env_rules:emails_main"
messages = "gaia2_cli.env_rules:messages_main"
chats = "gaia2_cli.env_rules:chats_main"
rent-a-flat = "gaia2_cli.env_rules:rent_a_flat_main"
city = "gaia2_cli.env_rules:city_main"
cabs = "gaia2_cli.env_rules:cabs_main"
shopping = "gaia2_cli.env_rules:shopping_main"
cloud-drive = "gaia2_cli.env_rules:cloud_drive_main"
gaia2-init = "gaia2_cli.init_cmd:main"
gaia2-eventd = "gaia2_cli.daemon.eventd:main"
gaia2-replay = "gaia2_cli.daemon.replay:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
judge = ["litellm>=1.0"]

[tool.setuptools.packages.find]
include = ["gaia2_cli*"]

[tool.uv.sources]
gaia2-core = { path = "../core", editable = true }
