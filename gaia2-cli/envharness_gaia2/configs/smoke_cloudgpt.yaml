# EnvHarness on GAIA2 with OpenClaw (plan v2): corpus -> skill bank -> eval, over co-evolution rounds.
# Execution values follow /mnt/data2/Auto_Saddler/sandbox/AutoSaddler/configs/v2/meta_are_autosaddler_smoke_cloudgpt.yaml
# and AutoSaddler configs/v2/gaia2_openclaw_autosaddler_smoke_cloudgpt.yaml; EnvHarness values follow the
# original experiments/swebench corpus (K=5, band [0.4, 0.6], max_k 5; smoke: max_k 1 like corpus_smoke.yaml).
schema_version: envharness-gaia2/v2

meta_are_repo: /mnt/data2/v-parksungho_icml/Meta-ARE        # feat/gaia2-openclaw-envharness
seed_harness_dir: gaia2-cli/harness/openclaw                 # the student's harness; only skills/ gets the bank
harness_policy: gaia2-cli/envharness_gaia2/configs/harness_policy_skillbank.json
image: localhost/gaia2-oc:envh-097a373eab7f                  # env-rules A/T/O + Setup (097a373)
image_id: sha256:0e4b0688ac04e58e40a52f6411fd17166ec4815246b0896a54ad6b2f8f5daf80
container_runtime: docker
docker_group: docker

data:
  dataset_root: /mnt/data2/v-parksungho_icml/Meta-ARE/datasets_local/gaia2_cli_smoke
  dataset_source_descriptor: /mnt/data2/v-parksungho_icml/Meta-ARE/datasets_local/gaia2_cli_smoke/.autosaddler-gaia2-cli-source.json
  dataset_source_revision: 240ac47bfc62b24c934f95d014ffa5a3cab8b04c
  train_manifest: /mnt/data2/v-parksungho_icml/AutoSaddler/configs/datasets/GAIA2/train_smoke.json     # 6
  development_manifest: /mnt/data2/v-parksungho_icml/AutoSaddler/configs/datasets/GAIA2/val_smoke.json  # 1 (held-out eval)
  test_manifest: /mnt/data2/v-parksungho_icml/AutoSaddler/configs/datasets/GAIA2/test_universe_22.json  # unused in smoke

task_agent:
  provider: azure
  model: gpt-5.5-20260424
  base_url: https://cloudgpt-openai.azure-api.net/openai/
  reasoning_effort: xhigh
  thinking: high
  azure_config_dir: /mnt/data2/v-parksungho/cloudgpt-account
judge:
  provider: azure
  model: Llama-3.3-70B-Instruct
  base_url: https://cloudgpt-openai.azure-api.net/openai/
  time_check: "off"

run:
  scenario_timeout_seconds: 1800
  max_scenario_duration: 7200
  health_timeout_seconds: 180
  process_completion_grace_seconds: 60
  max_concurrent: 5
  infrastructure_retries: 1
  eval_repetitions: 1              # the paper attempts each evaluation instance once

optimizer_llm:                     # designer + skill induction
  model: gpt-5.5
  api_base: http://127.0.0.1:4148/v1
  wire_api: responses              # gpt-5.5 is served only on /responses there
  reasoning_effort: xhigh          # designer
  induce_reasoning_effort: low     # induction (original: temperature 0, reasoning_effort minimal)

envrigger:                         # experiments/swebench/corpus.yaml
  k_per_candidate: 5
  max_k: 1                         # smoke (full: 5)
  target_band: [0.4, 0.6]
  skip_passthrough_candidates: true

bank:                              # experiments/swebench/bank_distillation defaults
  max_pairs_per_task: 5
  max_baseline_rollouts: 5
  tier2_last_only: true
  dedup_titles: true
  embed_model: text-embedding-3-small
  concurrency: 4
  orig_seed: 0

coevolution:
  rounds: 2                        # 1 = the original single pass

budget:
  max_rollouts: 200

storage:
  run_root: /mnt/data2/v-parksungho_icml/working_dir/outputs/envharness_gaia2/runs
